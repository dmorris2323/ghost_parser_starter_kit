[tool.poetry]
name = "ghost-lantern"
version = "0.1.0"
description = "Ghost Lantern Labs — parser + fusion toolkit"
authors = ["Dexter Morris <dextermorris@example.com>"]
readme = "README.md"
packages = [{ include = "ghost_parser", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
pandas = "^2.2.0"
streamlit = "^1.37.0"
matplotlib = "^3.8.0"
tabulate = "^0.9.0"
numpy = "^1.26.0"
pyarrow = "^15.0.0"   # streamlit/pandas CSV/feather speedups

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.0.0"
ruff = "^0.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

