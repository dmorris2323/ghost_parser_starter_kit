[tool.poetry]
name = "ghost-lantern"
version = "0.1.0"
description = "Ghost Lantern Labs — parser + GUI foundation"
authors = ["Dexter Morris <you@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "ghost_parser", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
streamlit = "^1.39.0"
pandas = "^2.2.2"
pydantic = "^2.9.0"
tabulate = "^0.9.0"
matplotlib = "^3.10.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
ruff = "^0.6.9"
black = "^24.8.0"
pre-commit = "^3.8.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
